<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - TaskFlow</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         Sidebar
         ========================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <a
            href="../index.html"
            class="logo"
        >
            TaskFlow
        </a>


        <nav class="sidebar-nav">

            <a
                href="#"
                class="nav-item active"
                id="dashboardNav"
            >
                Dashboard
            </a>


            <a
                href="#"
                class="nav-item"
                id="allTasksNav"
            >
                All Tasks
            </a>


            <a
                href="#"
                class="nav-item"
                id="completedNav"
            >
                Completed
            </a>


            <a
                href="#"
                class="nav-item"
                id="categoriesNav"
            >
                Categories
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a
                href="#"
                class="nav-item"
            >
                Settings
            </a>


            <a
                href="#"
                class="nav-item"
                id="logoutBtn"
            >
                Logout
            </a>

        </div>

    </aside>



    <!-- =========================
         Main Dashboard
         ========================= -->

    <main class="dashboard">


        <!-- Dashboard Header -->

        <section class="dashboard-header">

            <div>

                <span class="page-label">
                    TASK MANAGEMENT
                </span>

                <h1>
                    My Tasks
                </h1>

                <p>
                    Organize your work and stay on top of your day.
                </p>

            </div>


            <button
                type="button"
                class="add-task-btn"
                id="addTaskBtn"
            >
                + Add Task
            </button>

        </section>



        <!-- =========================
             Task Summary
             ========================= -->

        <section class="task-summary">


            <div class="summary-card">

                <div class="summary-card-top">

                    <span>
                        Total Tasks
                    </span>

                </div>

                <p id="totalTasks">
                    0
                </p>

            </div>



            <div class="summary-card">

                <div class="summary-card-top">

                    <span>
                        Completed
                    </span>

                </div>

                <p id="completedTasks">
                    0
                </p>

            </div>



            <div class="summary-card">

                <div class="summary-card-top">

                    <span>
                        Pending
                    </span>

                </div>

                <p id="pendingTasks">
                    0
                </p>

            </div>


        </section>



        <!-- =========================
             Task List
             ========================= -->

        <section class="task-section">


            <div class="section-header">

                <div>

                    <h2 id="taskSectionTitle">
                        Tasks
                    </h2>

                    <p id="taskSectionDescription">
                        Your current tasks
                    </p>

                </div>

            </div>



            <div
                class="task-list"
                id="taskList"
            >

            </div>


        </section>


    </main>



    <!-- =========================
         Task Details
         ========================= -->

    <aside
        class="task-details"
        id="taskDetails"
    >

    </aside>



    <!-- =========================
         Add / Edit Task Modal
         ========================= -->

    <div
        class="modal"
        id="taskModal"
    >


        <div class="modal-content">


            <div class="modal-header">

                <div>

                    <span class="modal-label">
                        TASK
                    </span>

                    <h2 id="modalTitle">
                        Add Task
                    </h2>

                    <p id="modalDescription">
                        Create a new task.
                    </p>

                </div>


                <button
                    type="button"
                    class="close-modal"
                    id="closeModal"
                >
                    &times;
                </button>

            </div>



            <form id="taskForm">


                <div class="form-group">

                    <label for="taskTitle">
                        Task title
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        name="taskTitle"
                        placeholder="What needs to be done?"
                    >

                </div>



                <div class="form-group">

                    <label for="taskDescription">
                        Description
                    </label>

                    <textarea
                        id="taskDescription"
                        name="taskDescription"
                        placeholder="Add more details about this task..."
                    ></textarea>

                </div>



                <div class="form-group">

                    <label for="taskCategory">
                        Category
                    </label>

                    <select
                        id="taskCategory"
                        name="taskCategory"
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="work">
                            Work
                        </option>

                        <option value="personal">
                            Personal
                        </option>

                        <option value="school">
                            School
                        </option>

                        <option value="projects">
                            Projects
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="taskDueDate">
                        Due date
                    </label>

                    <input
                        type="date"
                        id="taskDueDate"
                        name="taskDueDate"
                    >

                </div>



                <button
                    type="submit"
                    class="save-task-btn"
                    id="saveTaskBtn"
                >
                    Save Task
                </button>


            </form>


        </div>


    </div>



    <script src="script.js"></script>

</body>

</html>
